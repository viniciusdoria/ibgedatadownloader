name: "✅ Linter"

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.12"


jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all --verbose
