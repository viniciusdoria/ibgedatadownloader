# -- Packaging --------------------------------------
[qgis-plugin-ci]
plugin_path = ibgedatadownloader
project_slug = ibgedatadownloader
[flake8]
select =
	A00,
	B,
	C4,
	C901,
	E,
	ENC0,
	F,
	FS00,
	I25,
	INP,
	M511,
	N400,
	N8,
	NQA,
	PD0,
	PT0,
	R50,
	SIM,
	W,
	QGS10,
	YTT
extend-select = B950
extend-ignore =
	B019,
	E203,
	E501,
	W503
exclude =
	.git,
	__pycache__,
	tests,
per-file-ignores =
	scripts/*:INP001
max-complexity = 25
max-doc-length = 119
max-line-length = 109
noqa-require-code = true
noqa-include-name = true

